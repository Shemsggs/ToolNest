[project]
name = "toolnest-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "supabase>=2.15,<3", "pypdf>=5.0,<7", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
